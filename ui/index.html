<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Solv Expenses</title>

    <!-- Stamp the stored theme before anything paints. Without this the page
         renders the default (dark) for a frame and then flips, which on a
         phone reads as a flash of the wrong colour on every load. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
