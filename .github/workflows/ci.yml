# Runs on Node 22 — the version the VM runs and the one main/scripts/jest.setup.js
# records as the reliable one for the route suites — and on Node 24, where
# development happens and where an upgrade would land. deploy.sh waits for this
# run to be green before it touches the server (SKIP_CI=1 to override).
name: ci
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung run used to sit for the default six hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - run: npm ci
      - run: npm --prefix ui ci
      # Lint as its own step, so a failure says "lint" rather than hiding in
      # the test count (the suite also runs it, in main/scripts/lint.test.js).
      - run: npm run lint
      - run: npm test
      - run: npm run build:ui
